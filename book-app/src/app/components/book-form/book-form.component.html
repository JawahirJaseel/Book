<div class="container">
  <div class="header">
    <h2>{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h2>
    <a routerLink="/" class="btn btn-secondary">Back to List</a>
  </div>

  <div *ngIf="isLoading && isEditMode" class="loading">
    Loading book details...
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div class="card form-card" *ngIf="!isLoading || !isEditMode">
    <form (ngSubmit)="onSubmit()" #bookForm="ngForm">
      
      <div class="form-group">
        <label for="title">Title *</label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          [(ngModel)]="book.title" 
          required
          class="form-control"
          placeholder="Enter book title">
      </div>

      <div class="form-group">
        <label for="author">Author *</label>
        <input 
          type="text" 
          id="author" 
          name="author" 
          [(ngModel)]="book.author" 
          required
          class="form-control"
          placeholder="Enter author name">
      </div>

      <div class="form-group">
        <label for="isbn">ISBN *</label>
        <input 
          type="text" 
          id="isbn" 
          name="isbn" 
          [(ngModel)]="book.isbn" 
          required
          class="form-control"
          placeholder="Enter ISBN">
      </div>

      <div class="form-group">
        <label for="publicationDate">Publication Date *</label>
        <input 
          type="date" 
          id="publicationDate" 
          name="publicationDate" 
          [(ngModel)]="book.publicationDate" 
          required
          class="form-control">
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="!bookForm.form.valid || isLoading">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Book' : 'Add Book') }}
        </button>
      </div>

    </form>
  </div>
</div>
